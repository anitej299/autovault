services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: autovault
      POSTGRES_PASSWORD: local_only_password
      POSTGRES_DB: autovault
    ports: ['127.0.0.1:5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U autovault']
      interval: 3s
      timeout: 3s
      retries: 20
  test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: autovault
      POSTGRES_PASSWORD: test_only_password
      POSTGRES_DB: autovault_test
    ports: ['127.0.0.1:5433:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U autovault']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
